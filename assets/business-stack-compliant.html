<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Android 逆向 · 合规业务方向</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px;
    background: #0d1117;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { color: #fff; font-size: 26px; margin: 0 0 6px; }
  .sub { color: #8b949e; font-size: 14px; margin-bottom: 40px; }
  .wrap {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px;
    max-width: 1200px; width: 100%;
  }
  .col { display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
  .head { color:#fff; font-weight:700; font-size:15px; padding:12px 14px; border-radius:10px; text-align:center; box-shadow:0 4px 14px rgba(0,0,0,.35); }
  .item { background:#161b22; color:#c9d1d9; border:1px solid #30363d; border-radius:8px; padding:10px 12px; font-size:13px; line-height:1.5; }
  .item b { color:#fff; }
  .red    { background:#e74c3c; }
  .green  { background:#27ae60; }
  .orange { background:#e67e22; }
  .yellow { background:#f1c40f; color:#1a1a1a; }
  .teal   { background:#16a085; }
  .core {
    grid-column: 1 / -1; text-align:center; font-size:20px; font-weight:800; color:#fff;
    background:#3a3a3a; padding:14px; border-radius:12px; margin-bottom:6px; letter-spacing:1px;
  }
</style>
</head>
<body>
  <div class="core">ANDROID 逆向 · 合规业务方向</div>
  <div class="wrap">
    <div class="col">
      <div class="head red">📊 数据采集（合规）</div>
      <div class="item"><b>授权</b> app / 网页数据采集</div>
      <div class="item">竞品数据分析</div>
    </div>
    <div class="col">
      <div class="head green">🔌 协议定制 & 系统集成</div>
      <div class="item">私有协议还原 / 接口 SDK 化</div>
      <div class="item">企业内部系统集成（<b>授权</b>）</div>
    </div>
    <div class="col">
      <div class="head orange">🛡 安全审计 & 对抗研究</div>
      <div class="item">脱壳 / 加固 / 算法提取</div>
      <div class="item">风控检测研究（<b>授权审计 / 自有 APP</b>）</div>
    </div>
    <div class="col">
      <div class="head yellow">🤖 自动化 & RPA</div>
      <div class="item">脚本 / 插件开发</div>
      <div class="item">抓包-分析-复现流水线</div>
    </div>
    <div class="col">
      <div class="head teal">🖥 系统级开发</div>
      <div class="item">定制 ROM</div>
      <div class="item">模拟器 / 虚拟机方案</div>
    </div>
  </div>
</body>
</html>
